services:
  elevation:
    build: .
    image: elevation-grid-warehouse:latest
    container_name: elevation-grid
    ports:
      - "8000:8000"
    environment:
      # 网格上限 10 万行 × 10 万列（仅逻辑边界，不预分配）
      ELEV_GRID_ROWS: "100000"
      ELEV_GRID_COLS: "100000"
      ELEV_DATA_DIR: "/data"
      ELEV_BUSY_TIMEOUT_MS: "30000"
    volumes:
      - elevation-data:/data
    healthcheck:
      # 用基础镜像自带 python，不引入 curl 依赖
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  elevation-data:
